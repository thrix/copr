---
- name: install python3-cryptography
  package:
    name: python3-cryptography
    state: present

- name: Generate the private key for the self-signed CA
  community.crypto.openssl_privatekey:
    path: "/root/self-signed-ca.key"
    size: 4096
    type: RSA
    mode: '0600'
    owner: root
  register: ca_key_status

- name: CSR for the CA
  community.crypto.openssl_csr:
    path: /root/self-signed-ca.csr
    privatekey_path: "{{ ca_key_status.filename }}"
    common_name: "Internal Copr CA"
    basic_constraints:
      - "CA:TRUE"
    basic_constraints_critical: true
    key_usage:
      - "keyCertSign"
      - "cRLSign"
  register: ca_csr_status

# `community.crypto.x509_certificate` imports `module_utils/urls.py`, broken on Fedora 45 with ansible-core 2.16
- name: Generate a self-signed CA
  ansible.builtin.command: >-
    openssl x509 -req -days 3650 -copy_extensions copyall
    -in {{ ca_csr_status.filename }} -signkey {{ ca_key_status.filename }}
    -out /root/self-signed-ca.crt
  args:
    creates: /root/self-signed-ca.crt

- name: generate a private server key
  community.crypto.openssl_privatekey:
    path: "/root/self-signed.key"
    size: 4096
    type: RSA
    mode: '0600'
    owner: root
  register: key_status

- name: Generate Certificate Signing Request (CSR) with CA Constraints
  community.crypto.openssl_csr:
    path: "/root/copr.csr"
    privatekey_path: "{{ key_status.filename }}"
    basic_constraints:
      - CA:FALSE
    basic_constraints_critical: true
    key_usage:
      - digitalSignature
      - keyEncipherment
    extended_key_usage:
      - serverAuth
    subject_alt_name:
      # Required for connecting via hostname 'localhost'
      - 'DNS:localhost'
      # Recommended for loopbacks
      - 'IP:127.0.0.1'
      # External connections.
      - 'DNS:{{ frontend_hostname }}'
      - 'IP:{{ frontend_hostname }}'
    common_name: "localhost"
    organization_name: "on"
    country_name: US
  register: server_csr_status

- name: Generate the certificate signed by our CA
  ansible.builtin.command: >-
    openssl x509 -req -days 3650 -copy_extensions copyall
    -in {{ server_csr_status.filename }}
    -CA /root/self-signed-ca.crt -CAkey {{ ca_key_status.filename }} -CAcreateserial
    -out /root/copr.pem
  args:
    creates: /root/copr.pem

- name: 'Generate secure token: {{ item.name }}'
  copy:
    content: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
    dest: "{{ item.path }}"
    mode: "0400"
    force: false
  no_log: true
  loop:
    - name: be-fe token
      path: /root/be-fe-token
    - name: postgresql password
      path: /root/fe-postgres-password

- name: Generate Pulp admin password
  copy:
    content: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
    dest: /root/pulp-admin-password
    mode: "0400"
    force: false
  no_log: true
  when: with_pulp | default(false) | bool

- name: Generate Pulp SECRET_KEY
  copy:
    content: "{{ lookup('ansible.builtin.password', '/dev/null', length=50, chars=['ascii_letters', 'digits']) }}"
    dest: /root/pulp-secret-key
    mode: "0400"
    force: false
  no_log: true
  when: with_pulp | default(false) | bool

- name: generate backend -> builder keypair
  community.crypto.openssh_keypair:
    path: /root/backend_builder
    type: ed25519
    comment: "Backend -> Builder key"
    mode: '0600'
