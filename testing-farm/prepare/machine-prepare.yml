---
- name: Prepare the testing machine for running Copr tests
  hosts: all
  user: "root"

  vars:
    host_with_secrets: '{{ inventory_hostname }}'
    # ansible-core 2.16 `module_utils/urls.py` needs `ssl.PROTOCOL_TLSv1`, missing in the Fedora 45
    # system Python. Use the Testing Farm standalone Python and its CLI-based package module instead.
    # https://docs.testing-farm.io/Testing%20Farm/0.1/faq.html#_how_to_use_the_standalone_python_runtime
    ansible_python_interpreter: /var/opt/standalone-python/bin/python3
    ansible_package_use: testing_farm_profiles.library.dnf_yum_cli
    test_user: single-host-testing
    frontend_hostname: "{{ public_ip }}"
    backend_hostname: "{{ public_ip }}"
    distgit_hostname: "{{ public_ip }}"
    with_pulp: false

  pre_tasks:
    - name: Install Python libraries needed by community.crypto and community.postgresql
      ansible.builtin.command: >-
        {{ ansible_python_interpreter }} -m pip install --only-binary :all: cryptography psycopg2-binary
      changed_when: true

    - name: Detect public IP address
      ansible.builtin.uri:
        url: https://ifconfig.me/ip
        return_content: true
        headers:
          Accept: text/plain
      register: public_ip_result

    - name: Set public_ip fact
      ansible.builtin.set_fact:
        public_ip: "{{ public_ip_result.content | trim }}"

    - name: Show detected public IP
      ansible.builtin.debug:
        msg: "Public IP: {{ public_ip }}"

  roles:
    - pre-release-packages
    - credentials
    - ca-trust
    - resalloc
    - distgit
    - role: pulp
      when: with_pulp | bool
    - backend
    - frontend
    - keygen
    - role: client
      vars:
        copr_username: "{{ test_user }}"

  handlers:
    - name: restart httpd
      ansible.builtin.systemd_service:
        name: httpd
        state: restarted
